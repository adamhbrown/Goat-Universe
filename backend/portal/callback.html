<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>GOAT Games · Account verification</title><link rel="stylesheet" href="/manage/style.css"></head><body>
<header><a href="/manage">GOAT GAMES</a><span>Account verification</span></header><main>
<p id="message" role="status" aria-live="polite">Checking your link…</p>
<section><form id="confirm" hidden><h1>Confirm your email address</h1><p>Select the button to confirm. Opening the link alone does not confirm your account.</p><button type="submit">Confirm email</button></form>
<form id="reset" hidden><h1>Choose a new password</h1><label>New password<input name="new_password" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></label><label>Repeat new password<input name="repeat_password" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></label><button type="submit">Reset password</button></form>
<a href="/manage">Return to sign in</a></section></main><script type="module" src="/auth/callback.mjs"></script></body></html>
