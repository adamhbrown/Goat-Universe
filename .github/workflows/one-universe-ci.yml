name: One Universe integration
on:
  pull_request:
    paths: ['backend/**', 'assets/**', 'guest/**', 'cinema/**', 'experience/**', '*.html', 'tests/**', 'supabase/migrations/**', 'package*.json', '.github/workflows/one-universe-ci.yml']
permissions:
  contents: read
jobs:
  integrated-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:bullpen
      - run: npm run test:universe
      - run: git diff --check
