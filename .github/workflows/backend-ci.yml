name: Backend tests
on:
  pull_request:
    paths: ['backend/**', 'supabase/**', 'package*.json', 'Dockerfile', '.dockerignore', '.github/workflows/backend-ci.yml']
  push:
    branches: ['codex/backend-foundations']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Build the isolated hosting image (no deployment or credentials)
        run: docker build --tag goat-backend-check .
      - name: Verify container is non-root and refuses unconfigured hosted startup
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' goat-backend-check)" = node
          if docker run --rm goat-backend-check; then
            echo 'Unconfigured hosted startup must fail closed'
            exit 1
          fi
