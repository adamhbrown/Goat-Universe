name: Backend tests
on:
  pull_request:
    paths: ['backend/**', 'supabase/**', 'package*.json', '.github/workflows/backend-ci.yml']
  push:
    branches: ['codex/backend-foundations']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
