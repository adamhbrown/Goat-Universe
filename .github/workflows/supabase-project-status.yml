name: Supabase project status (read only)
on:
  workflow_dispatch:
  push:
    branches: ['codex/backend-foundations']
    paths: ['.github/workflows/supabase-project-status.yml']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Diagnose management authentication separately from project provisioning
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node backend/scripts/check-management-status.mjs
