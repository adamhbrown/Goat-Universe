name: Supabase migration dry run

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    environment: development
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enforce controlled-remediation migration hold
        run: node backend/scripts/validate-migration-hold.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Validate isolated development configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DEV_PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DEV_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Configure the development environment token, project reference, and database password."
            exit 1
          fi
          node --input-type=module <<'JS'
          import {isProtectedProject} from './backend/protected-projects.mjs';
          if (!/^[a-z]{20}$/.test(process.env.SUPABASE_DEV_PROJECT_REF) || isProtectedProject(process.env.SUPABASE_DEV_PROJECT_REF)) {
            console.error('Protected or invalid development project target.');
            process.exitCode=1;
          }
          JS

      - name: Link through the IPv4-capable session pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DEV_PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_DEV_PROJECT_REF"

      - name: Migration dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
        run: |
          supabase db push --dry-run --skip-vault
